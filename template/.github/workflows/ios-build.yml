name: iOS build (unsigned IPA)

# Builds an UNSIGNED .ipa on a GitHub-hosted macOS runner, for sideloading from
# Windows with Sideloadly (free 7-day signing). No Apple Developer account needed.
# Trigger manually (Actions → Run workflow) or by pushing a v* tag.
# Set repository VARIABLES so the app can reach Supabase at runtime:
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY  (public config)

on:
  workflow_dispatch:
    inputs:
      # macOS runners bill at 10x on PRIVATE repos (~200 real free minutes/month), and a
      # build is 20-40 min. Building both variants by default burns the month's quota on a
      # single dispatch. Default to `release` alone; ask for more only when you need it.
      variant:
        description: 'Which IPA to build'
        type: choice
        default: release
        options: [release, dev-client, both]
  push:
    tags: ['v*']

jobs:
  build:
    # macos-15 ships Xcode 16.x by default; RN 0.81 / Expo SDK 54 require Xcode 16.1+
    # (macos-14's default Xcode 15.4 cannot build the native project).
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # A tag push (no inputs) keeps the original behaviour: build both.
        variant: >-
          ${{ (github.event_name != 'workflow_dispatch' || inputs.variant == 'both')
              && fromJSON('["release","dev-client"]')
              || fromJSON(format('["{0}"]', inputs.variant)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Write .env (public config)
        run: |
          if [ -z "${{ vars.EXPO_PUBLIC_SUPABASE_URL }}" ] || [ -z "${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "::error::Set repo variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions → Variables). Building without them ships a non-launching IPA."
            exit 1
          fi
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ vars.EXPO_PUBLIC_SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" >> .env

      - name: Add expo-dev-client (dev-client variant only)
        if: matrix.variant == 'dev-client'
        run: npx expo install expo-dev-client

      - name: Prebuild iOS native project
        run: npx expo prebuild -p ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Strip push/iCloud entitlements (free signing rejects them)
        run: |
          for ENT in ios/*/*.entitlements; do
            [ -f "$ENT" ] || continue
            for KEY in aps-environment \
                       com.apple.developer.icloud-container-identifiers \
                       com.apple.developer.icloud-services \
                       com.apple.developer.ubiquity-kvstore-identifier \
                       com.apple.developer.associated-domains \
                       com.apple.developer.applesignin; do
              /usr/libexec/PlistBuddy -c "Delete :$KEY" "$ENT" 2>/dev/null || true
            done
            echo "Stripped restricted entitlements from $ENT"
          done

      - name: Resolve Xcode scheme
        id: scheme
        run: echo "name=$(ls ios/*.xcworkspace | head -1 | xargs basename | sed 's/\.xcworkspace//')" >> "$GITHUB_OUTPUT"

      - name: Archive without code signing
        run: |
          cd ios
          xcodebuild archive \
            -workspace "${{ steps.scheme.outputs.name }}.xcworkspace" \
            -scheme "${{ steps.scheme.outputs.name }}" \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned .ipa (Payload/ zip trick)
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qr "app-${{ matrix.variant }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.variant }}-ipa
          path: ios/build/app-${{ matrix.variant }}-unsigned.ipa
          if-no-files-found: error
